# nginx for mapping.132.145.21.55.nip.io  (TLS lines managed by Certbot).
#
# CURRENT (preview): "/" → vanilla FastAPI app (unchanged), "/next" → Next.js.
# CUTOVER: rebuild Next WITHOUT NEXT_BASE_PATH, then swap the two location
# blocks below (see the CUTOVER comment). Keep "/legacy" → FastAPI for one
# release as a rollback path.

server {
    server_name mapping.132.145.21.55.nip.io;
    client_max_body_size 25m;

    # --- Next.js frontend (preview under /next) ---
    location /next {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- FastAPI: API + the current vanilla frontend at "/" ---
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ============================ CUTOVER =============================
    # When the Next app reaches parity, replace the two blocks above with:
    #
    #   location /api  { proxy_pass http://127.0.0.1:8765; ... }   # FastAPI
    #   location /tiles { proxy_pass http://127.0.0.1:8765; ... }  # tiles
    #   location /legacy { proxy_pass http://127.0.0.1:8765; ... } # old UI (rollback)
    #   location /      { proxy_pass http://127.0.0.1:3100; ... }  # Next (root)
    #
    # …and restart mapping-next after a root rebuild (no NEXT_BASE_PATH).
    # ==================================================================

    listen 443 ssl; # managed by Certbot
    # ssl_certificate / ssl_certificate_key … (Certbot-managed)
}
