# nginx for mapping.132.145.21.55.nip.io  (TLS lines managed by Certbot).
#
# PRODUCTION (root cutover done): Next.js app at "/", FastAPI at "/api" + "/tiles".
# Rollback: point the "/" block's proxy_pass back at 127.0.0.1:8765 and reload
# (FastAPI + the vanilla frontend keep running on 8765).

server {
    server_name mapping.132.145.21.55.nip.io;
    client_max_body_size 25m;

    # --- FastAPI backend: API + local tiles ---
    location /api {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /tiles {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js app at root ---
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    # ssl_certificate / ssl_certificate_key … (Certbot-managed)
}
