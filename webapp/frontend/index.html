<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upande Bed &amp; Zone Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Upande Bed &amp; Zone Mapper</h1>
    <span id="status" class="status-idle">ready</span>
  </header>

  <main>
    <aside id="panel">
      <section>
        <h2>1. Polygon</h2>
        <p class="hint">Draw on the map, or paste a GeoJSON Polygon / FeatureCollection below.</p>
        <textarea id="geojsonInput" placeholder='{"type":"Polygon","coordinates":[[[lon,lat],...]]}'></textarea>
        <div class="row">
          <button id="loadGeoJson" class="secondary">Load pasted GeoJSON</button>
          <button id="clearPolygon" class="secondary">Clear</button>
        </div>
      </section>

      <section>
        <h2>2. Parameters</h2>
        <label>Plot name <input id="name" type="text" placeholder="e.g. Kapkolia GH 18" /></label>
        <label>Bed spacing (m) <input id="bedSpacing" type="number" step="0.1" min="0.1" value="1.5" /></label>
        <label>Zone length (m) <input id="zoneLength" type="number" step="0.5" min="0.5" value="10" /></label>
        <label>Inward buffer (m) <input id="bufferM" type="number" step="0.05" min="0" value="0.1" /></label>
        <label>Bed direction
          <select id="direction">
            <option value="along_long_axis" selected>Along long axis (default)</option>
            <option value="across_long_axis">Across long axis</option>
          </select>
        </label>
      </section>

      <section>
        <h2>3. Generate</h2>
        <button id="generate" class="primary">Generate beds &amp; zones</button>
        <div id="summary" class="summary"></div>
      </section>

      <section>
        <h2>4. Saved outputs</h2>
        <button id="refreshOutputs" class="secondary">Refresh</button>
        <ul id="outputs" class="outputs"></ul>
      </section>

      <section>
        <h2>5. Basemap API keys</h2>
        <p class="hint">Saved in this browser only (localStorage). Leave blank to hide that layer.</p>
        <label>Mapbox token <input id="mapboxKey" type="text" placeholder="pk.ey..." /></label>
        <label>MapTiler key <input id="maptilerKey" type="text" placeholder="abc123..." /></label>
        <label>Stadia key <input id="stadiaKey" type="text" placeholder="xxxx-xxxx-xxxx" /></label>
        <button id="saveKeys" class="secondary">Save &amp; reload</button>
      </section>
    </aside>

    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="/app.js"></script>
</body>
</html>
